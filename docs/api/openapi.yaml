        creadoEn: { $ref: '#/components/schemas/Instante' }
    NuevoCambio:
      type: object
      additionalProperties: false
      required: [horario, alcance, monto, motivo]
      properties:
        horario: { $ref: '#/components/schemas/Horario' }
        alcance: { type: string, minLength: 1, maxLength: 2000 }
        monto: { oneOf: [{ $ref: '#/components/schemas/Monto' }, { type: 'null' }] }
        motivo: { type: [string, 'null'], enum: [otro_trabajo, imprevisto, falta_repuesto, pedido_del_cliente, clima, otro, null], description: se le muestra al usuario (0.7.0) }
    AgendaItem:
      type: object
      additionalProperties: false
      required: [id, trabajoId, pedidoId, titulo, inicio, fin, estado, superpuesto]
      properties:
        id: { type: string }
        trabajoId: { type: [string, 'null'], format: uuid }
        pedidoId: { type: [string, 'null'], format: uuid }
        titulo: { type: string }
        inicio: { $ref: '#/components/schemas/Instante' }
        fin: { oneOf: [{ $ref: '#/components/schemas/Instante' }, { type: 'null' }] }
        estado: { type: string, enum: [confirmado, cambio_pendiente, oferta_pendiente] }
        superpuesto: { type: boolean }
    Conversacion:
      type: object
      additionalProperties: false
      required: [id, pedidoId, trabajoId, contraparte, etapa, ultimoMensaje, noLeidos, actualizadoEn]
      properties:
        id: { type: string, format: uuid }
        pedidoId: { type: string, format: uuid }
        trabajoId: { type: [string, 'null'], format: uuid }
        contraparte: { type: string }
        etapa: { type: string, enum: [cotizando, trabajo, cerrada] }
        ultimoMensaje: { type: [string, 'null'] }
        noLeidos: { type: integer, minimum: 0 }
        actualizadoEn: { $ref: '#/components/schemas/Instante' }
    CajaResumen:
      type: object
      additionalProperties: false
      required: [pendiente, reportado, verificado, feeHandyPeriodo]
      properties:
        pendiente: { $ref: '#/components/schemas/Monto' }
        reportado: { $ref: '#/components/schemas/Monto' }
        verificado: { $ref: '#/components/schemas/Monto' }
        feeHandyPeriodo: { $ref: '#/components/schemas/Monto' }
    CasoSoporteDetalle:
      allOf:
        - { $ref: '#/components/schemas/CasoSoporte' }
        - type: object
          required: [detalle, eventos]
          properties:
            detalle: { type: string }
            eventos:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [id, autor, texto, adjuntos, creadoEn]
                properties:
                  id: { type: string, format: uuid }
                  autor: { type: string, enum: [vos, handy] }
                  texto: { type: string }
                  adjuntos: { type: integer, minimum: 0 }
                  creadoEn: { $ref: '#/components/schemas/Instante' }
