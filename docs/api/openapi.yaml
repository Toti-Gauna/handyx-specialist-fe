            etiqueta: { type: [string, 'null'] }
        transferencia:
          description: '0.11.0 · alias o CBU que le mostrás al cliente después de contratar; cifrado, vuelve enmascarado (opcional hasta 1.0.0)'
          type: object
          additionalProperties: false
          required: [activa, aliasEnmascarado]
