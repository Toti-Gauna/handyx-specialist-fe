      summary: 'Marcar leído un aviso'
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/Csrf' }]
      responses: { '204': { description: Marcado }, '401': { $ref: '#/components/responses/Error' } }
  /v1/especialista/bandeja/{id}:
    delete:
      tags: [cuenta]
      summary: 'Borrar un aviso (lo importante sigue en su pantalla)'
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/Csrf' }]
      responses: { '204': { description: Borrado }, '401': { $ref: '#/components/responses/Error' } }
  /v1/especialista/privacidad/exportacion:
    get:
      tags: [cuenta]
      summary: 'Estado de la descarga de tus datos (null si no pediste)'
      responses:
        '200':
          description: 'Exportación o null'
          content:
            'application/json':
              schema: { oneOf: [{ $ref: '#/components/schemas/ExportacionDatos' }, { type: 'null' }] }
        '401': { $ref: '#/components/responses/Error' }
    post:
      tags: [cuenta]
      summary: 'Pedir tus datos: se arman en hasta 48 h y se bajan con una URL firmada corta'
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content: { 'application/json': { schema: { $ref: '#/components/schemas/Reautenticacion' } } }
      responses:
        '202':
          description: Pedida
          content: { 'application/json': { schema: { $ref: '#/components/schemas/ExportacionDatos' } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    sesion:
      type: apiKey
      in: cookie
      name: __Host-handyx_esp
      description: Cookie HttpOnly/Secure/SameSite=Lax emitida por la API

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Csrf:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string }
    Idempotencia:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }

  responses:
    Error:
      description: Error con código estable, mensaje seguro y requestId
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorApi' } } }

  schemas:
    Instante: { type: string, format: date-time, description: UTC con Z }
    Monto:
      type: object
      additionalProperties: false
      required: [centavos, moneda]
      properties:
        centavos: { type: integer, minimum: 0 }
        moneda: { type: string, enum: [ARS] }
    Rubro: { type: string, enum: [electricidad, plomeria, gas, cerrajeria, albanileria, aire_acondicionado] }
    EstadoDocumento: { type: string, enum: [faltante, cargado, en_revision, verificado, rechazado, vencido] }
    ErrorApi:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [codigo, mensaje, requestId]
          properties:
            codigo:
              type: string
              enum:
                [validacion, no_autenticado, sin_permiso, no_encontrado, conflicto_version, propuesta_no_disponible,
                 transicion_invalida, pedido_no_elegible, tipo_archivo_prohibido, limite, servicio_no_disponible, interno]
            mensaje: { type: string }
            requestId: { type: string }
            campos:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [campo, codigo]
                properties:
                  campo: { type: string }
                  codigo: { type: string }
    Sesion:
      type: object
      additionalProperties: false
      required: [cuenta, csrfToken, expiraEn]
      properties:
        cuenta:
          type: object
          additionalProperties: false
          required: [id, roles, emailVerificado, terminosAceptados]
          properties:
            id: { type: string, format: uuid }
            roles: { type: array, items: { type: string, enum: [usuario, especialista] } }
            emailVerificado: { type: boolean, description: '0.3.0 · hasta verificar el código solo se puede verificar, reenviar o salir' }
            terminosAceptados: { type: boolean, description: '0.3.0 · las cuentas nuevas de Google o Apple aceptan después de entrar' }
        csrfToken: { type: string, minLength: 16 }
        expiraEn: { $ref: '#/components/schemas/Instante' }
    Punto:
      type: object
      additionalProperties: false
      required: [lat, lng]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
    ZonaMapa:
      type: object
      additionalProperties: false
      required: [centro, radioM]
      properties:
        centro: { $ref: '#/components/schemas/Punto' }
        radioM: { type: integer, minimum: 200, maximum: 5000 }
    Barrio:
      type: object
      additionalProperties: false
      required: [id, nombre, centro]
      properties:
        id: { type: string, minLength: 1 }
        nombre: { type: string, minLength: 1 }
        centro: { $ref: '#/components/schemas/Punto' }
    Posicion:
      type: object
      additionalProperties: false
      required: [punto, precisionM, en]
      properties:
        punto: { $ref: '#/components/schemas/Punto' }
        precisionM: { type: number, minimum: 0, maximum: 10000 }
        en: { $ref: '#/components/schemas/Instante' }
    Trayecto:
      type: object
      additionalProperties: false
      required: [linea, distanciaM, duracionS, version]
      properties:
        linea: { type: array, minItems: 2, maxItems: 5000, items: { $ref: '#/components/schemas/Punto' } }
        distanciaM: { type: integer, minimum: 0 }
        duracionS: { type: integer, minimum: 0 }
        version: { type: integer, minimum: 0 }
    Viaje:
      type: object
      additionalProperties: false
      required: [trabajoId, destino, estado, trayecto, ultimaPosicion, distanciaRestanteM, llegadaEstimada]
      properties:
        trabajoId: { type: string, format: uuid }
        destino: { $ref: '#/components/schemas/Punto' }
        estado: { type: string, enum: [sin_compartir, compartiendo, terminado] }
        trayecto:
          description: Null sin posición o si el motor de trayectos no pudo calcularlo
          oneOf: [{ $ref: '#/components/schemas/Trayecto' }, { type: 'null' }]
        ultimaPosicion: { oneOf: [{ $ref: '#/components/schemas/Posicion' }, { type: 'null' }] }
        distanciaRestanteM: { type: [integer, 'null'], minimum: 0 }
        llegadaEstimada: { oneOf: [{ $ref: '#/components/schemas/Instante' }, { type: 'null' }] }
    VerificacionEmail:
      type: object
      additionalProperties: false
      required: [emailEnmascarado, venceEn, reenviarDesde, intentosRestantes]
      properties:
        emailEnmascarado: { type: string, description: 'ma•••@dominio' }
        venceEn: { $ref: '#/components/schemas/Instante' }
        reenviarDesde: { $ref: '#/components/schemas/Instante' }
        intentosRestantes: { type: integer, minimum: 0 }
    ResultadoProveedor:
      type: object
      additionalProperties: false
      required: [sesion, cuentaNueva]
      properties:
        sesion: { $ref: '#/components/schemas/Sesion' }
        cuentaNueva: { type: boolean }
    EstadoToken:
      type: object
      additionalProperties: false
      required: [estado]
      properties:
        estado: { type: string, enum: [valido, vencido, usado] }
    TurnoAntecedentes:
      type: object
      additionalProperties: false
      required: [id, inicio, fin, lugar, disponible]
      properties:
        id: { type: string, format: uuid }
        inicio: { $ref: '#/components/schemas/Instante' }
        fin: { $ref: '#/components/schemas/Instante' }
        lugar: { type: string, description: oficina de Operations (dato público) }
        disponible: { type: boolean }
    CitaAntecedentes:
      type: object
      additionalProperties: false
      required: [turnoId, inicio, fin, lugar]
      properties:
        turnoId: { type: string, format: uuid }
        inicio: { $ref: '#/components/schemas/Instante' }
        fin: { $ref: '#/components/schemas/Instante' }
        lugar: { type: string }
    PerfilEspecialista:
      type: object
      additionalProperties: false
      required: [id, email, nombre, apellido, estadoAlta, motivoRevision, documentos, antecedentes, citaAntecedentes, rubros, faltantesEnvio, baja, version]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        nombre: { type: [string, 'null'] }
        apellido: { type: [string, 'null'] }
        faltantesEnvio: { type: array, items: { type: string, enum: [datos, dni, cuitCuil, fotoCara, rubros, matricula] } }
        estadoAlta:
          type: string
          enum: [borrador, enviada, en_revision, requiere_correccion, habilitada, rechazada, suspendida]
        motivoRevision: { type: [string, 'null'] }
        documentos:
          type: object
          additionalProperties: false
          required: [dni, cuitCuil, fotoCara]
          properties:
            dni: { $ref: '#/components/schemas/EstadoDocumento' }
            cuitCuil: { $ref: '#/components/schemas/EstadoDocumento' }
            fotoCara: { $ref: '#/components/schemas/EstadoDocumento' }
        antecedentes:
          type: string
          enum: [pendiente_cita, cita_coordinada, aprobada, no_aprobada, no_asistio]
        citaAntecedentes:
          description: Turno reservado para la verificación presencial (0.5.0)
          oneOf: [{ $ref: '#/components/schemas/CitaAntecedentes' }, { type: 'null' }]
        rubros:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [rubro, estado, matricula]
            properties:
              rubro: { $ref: '#/components/schemas/Rubro' }
              estado: { type: string, enum: [elegido, habilitado, requiere_matricula, en_revision, no_habilitado] }
              matricula: { oneOf: [{ $ref: '#/components/schemas/EstadoDocumento' }, { type: 'null' }] }
        baja:
          type: [string, 'null']
          enum: [solicitada, en_proceso, completada, completada_con_retencion, cancelada, null]
        version: { type: integer, minimum: 0 }
    Franja:
      type: object
      additionalProperties: false
      required: [dia, desde, hasta]
      properties:
        dia: { type: integer, minimum: 0, maximum: 6 }
        desde: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
        hasta: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
    Disponibilidad:
      type: object
      additionalProperties: false
      required: [urgentesAhora, urgentesCambiadoEn, programados, franjas, zonas, version]
      properties:
        urgentesAhora: { type: boolean }
        urgentesCambiadoEn: { oneOf: [{ $ref: '#/components/schemas/Instante' }, { type: 'null' }] }
        programados: { type: boolean }
        franjas: { type: array, items: { $ref: '#/components/schemas/Franja' } }
        zonas: { type: array, items: { type: string } }
        version: { type: integer, minimum: 0 }
    CambioDisponibilidad:
      type: object
      additionalProperties: false
      required: [urgentesAhora, programados, version]
      properties:
        urgentesAhora: { type: boolean }
        programados: { type: boolean }
        franjas: { type: array, items: { $ref: '#/components/schemas/Franja' } }
        zonas: { type: array, items: { type: string } }
        version: { type: integer, minimum: 0 }
    PedidoElegible:
      type: object
      additionalProperties: false
      required: [id, rubro, tipo, descripcion, zonaAproximada, zonaMapa, fechaSolicitada, creadoEn, ventanaHasta, estado, miPropuesta]
      properties:
        id: { type: string, format: uuid }
        rubro: { $ref: '#/components/schemas/Rubro' }
        tipo: { type: string, enum: [urgente, programado, obra] }
        descripcion: { type: string }
        zonaAproximada: { type: string }
        zonaMapa:
          description: Centro ya desplazado por el servidor y radio. Nunca el punto exacto del hogar antes del acuerdo
          oneOf: [{ $ref: '#/components/schemas/ZonaMapa' }, { type: 'null' }]
        fechaSolicitada: { oneOf: [{ $ref: '#/components/schemas/Instante' }, { type: 'null' }] }
        creadoEn: { $ref: '#/components/schemas/Instante' }
        ventanaHasta: { oneOf: [{ $ref: '#/components/schemas/Instante' }, { type: 'null' }] }
        estado: { type: string, enum: [buscando, sin_propuestas, busqueda_manual, acordado, cancelado] }
        miPropuesta:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [id, estado]
              properties:
                id: { type: string, format: uuid }
                estado: { type: string, enum: [pendiente, aceptada, rechazada, reemplazada, vencida, retirada] }
    Horario:
      type: object
      additionalProperties: false
      required: [inicio, fin]
      properties:
        inicio: { $ref: '#/components/schemas/Instante' }
        fin: { oneOf: [{ $ref: '#/components/schemas/Instante' }, { type: 'null' }] }
    Propuesta:
      type: object
      additionalProperties: false
      required: [id, pedidoId, autorRol, monto, alcance, horario, venceEn, estado, reemplazaA, version]
      properties:
        id: { type: string, format: uuid }
        pedidoId: { type: string, format: uuid }
        autorRol: { type: string, enum: [usuario, especialista] }
        monto: { $ref: '#/components/schemas/Monto' }
        alcance: { type: string, maxLength: 2000 }
        horario: { $ref: '#/components/schemas/Horario' }
        venceEn: { $ref: '#/components/schemas/Instante' }
        estado: { type: string, enum: [pendiente, aceptada, rechazada, reemplazada, vencida, retirada] }
        reemplazaA: { type: [string, 'null'], format: uuid }
        version: { type: integer, minimum: 0 }
        incluyeMateriales: { type: boolean, description: '0.11.0 · el cliente ve que el precio incluye los materiales (opcional hasta 1.0.0)' }
        garantiaDias: { type: [integer, 'null'], minimum: 1, maximum: 365, description: '0.11.0 · días de garantía que muestra la propuesta (opcional hasta 1.0.0)' }
    NuevaPropuesta:
      type: object
      additionalProperties: false
      required: [pedidoId, monto, alcance, horario, reemplazaA]
      properties:
        pedidoId: { type: string, format: uuid }
        monto: { $ref: '#/components/schemas/Monto' }
        alcance: { type: string, minLength: 1, maxLength: 2000 }
        horario: { $ref: '#/components/schemas/Horario', description: 'Una franja (fin) o una hora exacta (fin null). Fuera de horario no hay recargo automático' }
        reemplazaA: { type: [string, 'null'], format: uuid }
        incluyeMateriales: { type: boolean, description: '0.11.0' }
        garantiaDias: { type: [integer, 'null'], minimum: 1, maximum: 365, description: '0.11.0' }
    RespuestaPropuesta:
      type: object
      additionalProperties: false
      required: [accion, version]
      properties:
        accion: { type: string, enum: [aceptar, rechazar] }
        version: { type: integer, minimum: 0 }
    Trabajo:
      type: object
      additionalProperties: false
      required: [id, pedidoId, propuestaAceptadaId, rubro, tipo, acuerdo, direccion, destino, estado, llegada, conversacionId, version]
      properties:
        id: { type: string, format: uuid }
        pedidoId: { type: string, format: uuid }
        propuestaAceptadaId: { type: string, format: uuid }
        rubro: { $ref: '#/components/schemas/Rubro' }
        tipo: { type: string, enum: [urgente, programado, obra] }
        acuerdo:
          type: object
          additionalProperties: false
          required: [monto, alcance, horario]
          properties:
            monto: { $ref: '#/components/schemas/Monto' }
            alcance: { type: string }
            horario: { $ref: '#/components/schemas/Horario' }
        direccion: { type: [string, 'null'], description: solo con trabajo acordado y para sus partes }
        destino:
          description: Punto exacto del destino, con la misma regla que la dirección (0.4.0)
          oneOf: [{ $ref: '#/components/schemas/Punto' }, { type: 'null' }]
        estado: { type: string, enum: [agendado, en_camino, en_sitio, en_curso, finalizado, cancelado] }
        llegada:
          description: Cómo se marcó la llegada (0.7.0); null hasta llegar
          oneOf: [{ $ref: '#/components/schemas/Llegada' }, { type: 'null' }]
        conversacionId: { type: string, format: uuid }
        version: { type: integer, minimum: 0 }
    Llegada:
      type: object
      additionalProperties: false
      required: [modo, motivo, en]
      properties:
        modo: { type: string, enum: [automatica, respaldo], description: 'automatica: geocerca de 80 m con precisión de 50 m o mejor, con la app abierta' }
        motivo: { type: [string, 'null'], enum: [sin_permiso, imprecisa, sin_senal, sin_ubicacion, null] }
        en: { $ref: '#/components/schemas/Instante' }
    Adicional:
      type: object
      additionalProperties: false
      required: [id, trabajoId, etapaId, tipo, descripcion, monto, estado, creadoEn, respondidoEn, version]
      properties:
        id: { type: string, format: uuid }
        trabajoId: { type: string, format: uuid }
        etapaId: { type: [string, 'null'], format: uuid, description: en una obra, la etapa a la que se suma (0.8.0) }
        tipo: { type: string, enum: [repuesto, mano_de_obra] }
        descripcion: { type: string }
        monto: { $ref: '#/components/schemas/Monto' }
        estado: { type: string, enum: [pendiente, aceptado, rechazado, retirado] }
        creadoEn: { $ref: '#/components/schemas/Instante' }
        respondidoEn: { oneOf: [{ $ref: '#/components/schemas/Instante' }, { type: 'null' }] }
        version: { type: integer, minimum: 0 }
    NuevoAdicional:
      type: object
      additionalProperties: false
      required: [etapaId, tipo, descripcion, monto]
      properties:
        etapaId: { type: [string, 'null'], format: uuid, description: 'obligatorio en una obra: la etapa en curso (0.8.0)' }
        tipo: { type: string, enum: [repuesto, mano_de_obra] }
        descripcion: { type: string, minLength: 1, maxLength: 200 }
        monto: { $ref: '#/components/schemas/Monto', description: mayor a cero }
    LlamadaPuente:
      type: object
      additionalProperties: false
      required: [telefono, venceEn]
      properties:
        telefono: { type: string, pattern: '^\+[0-9]{2,15}$', description: número puente de Handyx; no es el teléfono de la otra parte }
        venceEn: { $ref: '#/components/schemas/Instante' }
    Mensaje:
      type: object
      additionalProperties: false
      required: [id, conversacionId, autorRol, tipo, texto, mediaUrl, propuestaId, enviadoEn]
      properties:
        id: { type: string, format: uuid }
        conversacionId: { type: string, format: uuid }
        autorRol: { type: string, enum: [usuario, especialista, operations] }
        tipo: { type: string, enum: [texto, foto, propuesta] }
        texto: { type: [string, 'null'] }
        mediaUrl: { type: [string, 'null'], format: uri, description: URL firmada de corta duración }
        propuestaId: { type: [string, 'null'], format: uuid }
        enviadoEn: { $ref: '#/components/schemas/Instante' }
    Pago:
      type: object
      additionalProperties: false
      required: [id, trabajoId, etapaId, descripcion, feeHandy, neto, metodo, monto, estado, fuenteConfirmacion, referenciaProveedor, actualizadoEn]
      properties:
        id: { type: string, format: uuid }
        trabajoId: { type: string, format: uuid }
        etapaId: { type: [string, 'null'], format: uuid, description: en una obra, la etapa que se cobra (0.8.0) }
        descripcion: { type: string }
        feeHandy: { $ref: '#/components/schemas/Monto', description: 'Siempre 0 (0.11.0): Handyx no le cobra comisión al especialista, nunca' }
        neto: { $ref: '#/components/schemas/Monto', description: 'Igual a monto' }
        metodo: { type: string, enum: [mercado_pago, efectivo] }
        monto: { $ref: '#/components/schemas/Monto' }
        estado: { type: string, enum: [pendiente, reportado, verificado, fallido, en_discrepancia] }
        fuenteConfirmacion:
          type: [string, 'null']
          enum: [reporte_usuario, reporte_especialista, webhook_proveedor, operations, null]
        referenciaProveedor: { type: [string, 'null'] }
        actualizadoEn: { $ref: '#/components/schemas/Instante' }
    CasoSoporte:
      type: object
      additionalProperties: false
      required: [id, asunto, trabajoId, pedidoId, categoria, estado, creadoEn, actualizadoEn]
      properties:
        id: { type: string, format: uuid }
        asunto: { type: string }
        trabajoId: { type: [string, 'null'], format: uuid }
        pedidoId: { type: [string, 'null'], format: uuid }
        categoria: { type: string, enum: [asistencia, reclamo, pago, cuenta] }
        estado: { type: string, enum: [abierto, en_curso, esperando_respuesta, resuelto, cerrado] }
        creadoEn: { $ref: '#/components/schemas/Instante' }
        actualizadoEn: { $ref: '#/components/schemas/Instante' }
    PoliticaFee:
      type: object
      additionalProperties: false
      required: [id, version, alcance, desde, hastaExclusivo, ultimoDiaLocal, bpsUsuario, bpsEspecialista, estado]
      properties:
        id: { type: string }
        version: { type: integer, minimum: 1 }
        alcance: { type: string, enum: [demo_cerrada, general] }
        desde: { $ref: '#/components/schemas/Instante' }
        hastaExclusivo: { $ref: '#/components/schemas/Instante' }
        ultimoDiaLocal: { type: string, format: date }
        bpsUsuario: { type: integer, minimum: 0, maximum: 10000 }
        bpsEspecialista: { type: integer, minimum: 0, maximum: 0, description: 'Siempre 0 (0.11.0): una política que le cobre al especialista no es válida' }
        estado: { type: string, enum: [activa, borrador] }
    SugerenciaTablero:
      type: object
      additionalProperties: false
      required: [dispositivos, avisos]
      properties:
        dispositivos:
          type: array
          maxItems: 48
          items:
            type: object
            additionalProperties: false
            required: [tipo, calibre, circuito, confianza]
            properties:
              tipo: { type: string, enum: [termica_1p, termica_2p, termica_4p, diferencial_2p, diferencial_4p, sobretension, contactor, borneras] }
              calibre: { type: [integer, 'null'], minimum: 1, maximum: 250 }
              circuito: { type: string, maxLength: 40 }
              confianza: { type: string, enum: [alta, media, baja] }
        avisos: { type: array, maxItems: 5, items: { type: string, maxLength: 200 } }
    PresupuestoDictado:
      type: object
      additionalProperties: false
      required: [rubro, texto]
      properties:
        rubro: { $ref: '#/components/schemas/Rubro' }
        texto: { type: string, minLength: 10, maxLength: 1500 }
    PresupuestoSugerido:
      type: object
      additionalProperties: false
      required: [tareas, materiales, avisos]
      properties:
        tareas:
          type: array
          maxItems: 30
          items:
            type: object
            additionalProperties: false
            required: [descripcion, horas]
            properties:
              descripcion: { type: string, minLength: 1, maxLength: 200 }
              horas: { type: [number, 'null'], exclusiveMinimum: 0, maximum: 200 }
        materiales:
          type: array
          maxItems: 60
          items:
            type: object
            additionalProperties: false
            required: [descripcion, cantidad, unidad]
            properties:
              descripcion: { type: string, minLength: 1, maxLength: 200 }
