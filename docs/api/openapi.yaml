      type: object
      additionalProperties: false
      required: [estado, talle, manual, entrega, entregadoEn, version]
      properties:
        estado: { type: string, enum: [sin_elegir, elegido, preparando, listo, enviado, entregado] }
        talle: { oneOf: [{ type: string, enum: [S, M, L, XL, XXL] }, { type: 'null' }] }
        manual: { oneOf: [{ type: string, enum: [app, impreso, los_dos] }, { type: 'null' }] }
        entrega: { oneOf: [{ $ref: '#/components/schemas/EntregaElegida' }, { type: 'null' }] }
        entregadoEn: { oneOf: [{ $ref: '#/components/schemas/Instante' }, { type: 'null' }] }
        version: { type: integer, minimum: 0 }
    MiniCamino:
      type: object
      additionalProperties: false
      required: [id, tipo, nombre, rubro, progreso, hitos, proximoHitoId]
      properties:
        id: { type: string, format: uuid }
        tipo: { type: string, enum: [trabajos, cobros, oficio, practicas] }
        nombre: { type: string, maxLength: 80 }
        rubro:
          oneOf:
            - { type: string, enum: [electricidad, plomeria, gas, cerrajeria, albanileria, aire_acondicionado] }
            - { type: 'null' }
        progreso:
          type: object
          additionalProperties: false
          required: [trabajos, monto]
          properties: { trabajos: { type: integer, minimum: 0 }, monto: { $ref: '#/components/schemas/Monto' } }
        hitos: { type: array, items: { $ref: '#/components/schemas/Hito' } }
        proximoHitoId: { oneOf: [{ type: string, format: uuid }, { type: 'null' }] }
    NuevoCanje:
      type: object
      additionalProperties: false
      required: [talle, color, entrega]
      properties:
        talle: { oneOf: [{ type: string, enum: [S, M, L, XL, XXL] }, { type: 'null' }] }
        color: { oneOf: [{ type: string, maxLength: 30 }, { type: 'null' }] }
        entrega: { $ref: '#/components/schemas/Entrega' }
    PremioGanado:
      type: object
      additionalProperties: false
      required: [hitoId, caminoId, premio, estado, canje, ganadoEn]
      properties:
        hitoId: { type: string, format: uuid }
        caminoId: { type: string, format: uuid }
        premio: { $ref: '#/components/schemas/Premio' }
        estado: { type: string, enum: [pendiente, alcanzado, en_revision, disponible, canjeado, entregado] }
        canje: { oneOf: [{ $ref: '#/components/schemas/Canje' }, { type: 'null' }] }
        ganadoEn: { $ref: '#/components/schemas/Instante' }
    Premio:
      type: object
      additionalProperties: false
      required: [id, nombre, descripcion, rubro, talles, colores, imagen]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string, maxLength: 80 }
        descripcion: { type: string, maxLength: 200 }
        rubro:
          oneOf:
            - { type: string, enum: [electricidad, plomeria, gas, cerrajeria, albanileria, aire_acondicionado] }
            - { type: 'null' }
        talles: { type: array, items: { type: string, enum: [S, M, L, XL, XXL] } }
        colores: { type: array, items: { type: string, maxLength: 30 } }
        imagen: { oneOf: [{ type: string, format: uri }, { type: 'null' }] }
    PuntoRetiro:
      type: object
      additionalProperties: false
      required: [id, tipo, nombre, barrio, horario]
      properties:
        id: { type: string, format: uuid }
        tipo: { type: string, enum: [punto_handyx, ferreteria_aliada] }
        nombre: { type: string, maxLength: 80 }
        barrio: { type: string, maxLength: 80 }
        horario: { type: string, maxLength: 80 }
    AgendaMes:
      type: object
      additionalProperties: false
      required: [mes, dias, totales]
      properties:
        mes: { $ref: '#/components/schemas/Mes' }
        dias:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [fecha, trabajos, obras, hechos]
            properties:
              fecha: { $ref: '#/components/schemas/Fecha' }
              trabajos: { type: integer, minimum: 0 }
              obras:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [obraId, nombre]
                  properties: { obraId: { type: string, format: uuid }, nombre: { type: string, maxLength: 80 } }
              hechos: { type: integer, minimum: 0 }
        totales:
          type: object
          additionalProperties: false
          required: [trabajos, obras]
          properties: { trabajos: { type: integer, minimum: 0 }, obras: { type: integer, minimum: 0 } }
    Dia:
      type: object
      additionalProperties: false
      required: [fecha, paradas, terminaA, distanciaDiaM, distanciaMesM, version]
      properties:
        fecha: { $ref: '#/components/schemas/Fecha' }
        paradas: { type: array, items: { $ref: '#/components/schemas/Parada' } }
        terminaA: { oneOf: [{ $ref: '#/components/schemas/Instante' }, { type: 'null' }] }
        distanciaDiaM: { type: integer, minimum: 0 }
        distanciaMesM: { type: integer, minimum: 0 }
        version: { type: integer, minimum: 0 }
    OrdenParadas:
      type: object
      additionalProperties: false
      required: [turnos, version]
      properties:
        turnos: { type: array, minItems: 1, maxItems: 30, items: { type: string, format: uuid } }
        version: { type: integer, minimum: 0 }
    Parada:
      type: object
      additionalProperties: false
      required: [orden, turno, estado, opcional, tramo, salirA]
      properties:
        orden: { type: integer, minimum: 1 }
        turno: { $ref: '#/components/schemas/TurnoAgenda' }
        estado: { type: string, enum: [hecha, proxima, pendiente] }
        opcional: { type: boolean }
        tramo:
          oneOf:
            - type: object
              additionalProperties: false
              required: [distanciaM, duracionS, desvioS]
              properties:
                distanciaM: { type: integer, minimum: 0 }
                duracionS: { type: integer, minimum: 0 }
                desvioS: { oneOf: [{ type: integer, minimum: 0 }, { type: 'null' }] }
            - { type: 'null' }
        salirA: { oneOf: [{ $ref: '#/components/schemas/Instante' }, { type: 'null' }] }
    RecorridoDia:
      type: object
      additionalProperties: false
      required: [desde]
      properties:
        desde:
          oneOf:
            - type: object
              additionalProperties: false
              required: [punto, precisionM]
              properties:
                punto: { $ref: '#/components/schemas/Punto' }
                precisionM: { type: number, minimum: 0, maximum: 10000 }
            - { type: 'null' }
    ResumenAgenda:
      type: object
      additionalProperties: false
      required: [hoy, pasadas, deHoy, futuras, semana, cobradoMes, proximo]
      properties:
        hoy: { $ref: '#/components/schemas/Fecha' }
        pasadas: { type: integer, minimum: 0 }
        deHoy: { type: integer, minimum: 0 }
        futuras: { type: integer, minimum: 0 }
        semana:
          type: array
          minItems: 7
          maxItems: 7
          items:
            type: object
            additionalProperties: false
            required: [fecha, turnos]
            properties: { fecha: { $ref: '#/components/schemas/Fecha' }, turnos: { type: integer, minimum: 0 } }
        cobradoMes: { $ref: '#/components/schemas/Monto' }
        proximo: { oneOf: [{ $ref: '#/components/schemas/TurnoAgenda' }, { type: 'null' }] }
    TurnoAgenda:
      type: object
      additionalProperties: false
      required: [id, tipo, trabajoId, obraId, jornadaId, pedidoId, pedidoFerreteriaId, titulo, detalle, rubro, barrio, cliente, equipo, inicio, fin, estado, monto, cobro, superpuesto]
      properties:
        id: { type: string, format: uuid }
        tipo: { type: string, enum: [trabajo, jornada, oferta, retiro_ferreteria] }
        trabajoId: { oneOf: [{ type: string, format: uuid }, { type: 'null' }] }
        obraId: { oneOf: [{ type: string, format: uuid }, { type: 'null' }] }
        jornadaId: { oneOf: [{ type: string, format: uuid }, { type: 'null' }] }
        pedidoId: { oneOf: [{ type: string, format: uuid }, { type: 'null' }] }
        pedidoFerreteriaId: { oneOf: [{ type: string, format: uuid }, { type: 'null' }] }
        titulo: { type: string, maxLength: 80 }
        detalle: { type: string, maxLength: 140 }
        rubro:
          oneOf:
            - { type: string, enum: [electricidad, plomeria, gas, cerrajeria, albanileria, aire_acondicionado] }
            - { type: 'null' }
        barrio: { type: [string, 'null'] }
        cliente: { oneOf: [{ $ref: '#/components/schemas/PersonaVisible' }, { type: 'null' }] }
        equipo: { type: array, maxItems: 8, items: { type: string, minLength: 1, maxLength: 3 } }
        inicio: { $ref: '#/components/schemas/Instante' }
        fin: { oneOf: [{ $ref: '#/components/schemas/Instante' }, { type: 'null' }] }
        estado: { type: string, enum: [agendado, cambio_pendiente, oferta_pendiente, hecho, cancelado] }
        monto: { oneOf: [{ $ref: '#/components/schemas/Monto' }, { type: 'null' }] }
        cobro:
          oneOf:
            - type: object
              additionalProperties: false
              required: [estado, monto]
              properties:
                estado: { type: string, enum: [pendiente, reportado, verificado, fallido, en_discrepancia] }
                monto: { $ref: '#/components/schemas/Monto' }
            - { type: 'null' }
        superpuesto: { type: boolean }
    AvisoBandeja:
      type: object
      additionalProperties: false
      required: [id, tipo, titulo, cuerpo, iniciales, creadoEn, leido, destino]
      properties:
        id: { type: string, format: uuid }
        tipo:
          type: string
          enum: [pedido_urgente, pedido_programado, propuesta, te_eligieron, mensaje, trabajo, pago, soporte, cuenta, alta_habilitada, presupuesto, obra, repuesto, reparto, equipo, busqueda, ferreteria, camino, recordatorio]
        titulo: { type: string, maxLength: 80 }
        cuerpo: { type: string, maxLength: 140 }
        iniciales: { oneOf: [{ type: string, minLength: 1, maxLength: 3 }, { type: 'null' }] }
        creadoEn: { $ref: '#/components/schemas/Instante' }
        leido: { type: boolean }
        destino:
          type: object
          additionalProperties: false
          required: [ruta, id]
          properties:
            ruta:
              type: string
              enum: [pedido, trabajo, chat, soporte, cobros, cuenta, registro, presupuesto, obra, repuestos, reparto, busqueda, pedido_ferreteria, camino, premio]
            id: { oneOf: [{ type: string, format: uuid }, { type: 'null' }] }
    ExportacionDatos:
      type: object
      additionalProperties: false
      required: [estado, pedidaEn, listaAntesDe, descarga]
      properties:
        estado: { type: string, enum: [pedida, lista, vencida] }
        pedidaEn: { $ref: '#/components/schemas/Instante' }
        listaAntesDe: { $ref: '#/components/schemas/Instante' }
        descarga:
          oneOf:
            - type: object
              additionalProperties: false
              required: [url, venceEn]
              properties: { url: { type: string, format: uri }, venceEn: { $ref: '#/components/schemas/Instante' } }
            - { type: 'null' }
    GuardarPresentacion:
      type: object
      additionalProperties: false
      required: [presentacion, version]
      properties:
        presentacion: { oneOf: [{ type: string, maxLength: 280 }, { type: 'null' }] }
        version: { type: integer, minimum: 0 }
    PerfilPropio:
      type: object
      additionalProperties: false
      required: [nombrePublico, iniciales, foto, presentacion, rubros, verificado, matriculas, certificadosVerificados, certificadosEnRevision, trabajosVerificados, enHandyxDesde, version]
      properties:
        nombrePublico: { type: [string, 'null'] }
        iniciales: { type: string, minLength: 1, maxLength: 3 }
        foto: { oneOf: [{ type: string, format: uri }, { type: 'null' }] }
        presentacion: { oneOf: [{ type: string, maxLength: 280 }, { type: 'null' }] }
        rubros:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [rubro, habilitado]
            properties:
              rubro:
                type: string
                enum: [electricidad, plomeria, gas, cerrajeria, albanileria, aire_acondicionado]
              habilitado: { type: boolean }
        verificado: { type: boolean }
        matriculas:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [rubro, estado, venceEn]
            properties:
              rubro:
                type: string
                enum: [electricidad, plomeria, gas, cerrajeria, albanileria, aire_acondicionado]
              estado: { type: string, enum: [verificada, en_revision] }
              venceEn: { oneOf: [{ $ref: '#/components/schemas/Fecha' }, { type: 'null' }] }
        certificadosVerificados: { type: integer, minimum: 0 }
        certificadosEnRevision: { type: integer, minimum: 0 }
        trabajosVerificados: { type: integer, minimum: 0 }
        enHandyxDesde: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
        version: { type: integer, minimum: 0 }
