      properties:
        id: { type: string, format: uuid }
        pedidoId: { type: string, format: uuid }
        trabajoId: { type: [string, 'null'], format: uuid }
        contraparte: { type: string }
        etapa: { type: string, enum: [cotizando, trabajo, cerrada] }
        ultimoMensaje: { type: [string, 'null'] }
        noLeidos: { type: integer, minimum: 0 }
