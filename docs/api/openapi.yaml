      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/Csrf' }, { $ref: '#/components/parameters/Idempotencia' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [texto]
              properties:
                texto: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '200':
          description: Caso actualizado
          content: { application/json: { schema: { $ref: '#/components/schemas/CasoSoporteDetalle' } } }

  /v1/cuenta/preferencias:
    get:
      tags: [cuenta]
      responses:
        '200':
          description: Preferencias de avisos
          content: { application/json: { schema: { $ref: '#/components/schemas/Preferencias' } } }
    put:
      tags: [cuenta]
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [avisosUrgentes, avisosProgramados, avisosMensajes, avisosPagos]
              properties:
                avisosUrgentes: { type: boolean }
                avisosProgramados: { type: boolean }
                avisosMensajes: { type: boolean }
                avisosPagos: { type: boolean }
                avisosRecordatorios: { type: boolean, description: '0.11.0 · turnos, jornadas y repuestos que faltan (opcional hasta 1.0.0)' }
                avisosCamino: { type: boolean, description: '0.11.0 · cuando llegás a un premio' }
                avisosNovedades: { type: boolean, description: '0.11.0 · una vez por mes, como mucho' }
                silencio:
                  description: '0.11.0 · horario de silencio (Buenos Aires); los urgentes llegan igual si estás Disponible'
                  oneOf:
                    - type: object
                      additionalProperties: false
                      required: [desde, hasta]
                      properties:
                        desde: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
                        hasta: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
                    - { type: 'null' }
      responses:
        '200':
          description: Guardadas
          content: { application/json: { schema: { $ref: '#/components/schemas/Preferencias' } } }
  /v1/cuenta/push:
    post:
      tags: [cuenta]
      summary: Registrar el opt-in a avisos del dispositivo (la entrega no está garantizada)
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      responses:
        '200':
          description: Estado del permiso
          content: { application/json: { schema: { $ref: '#/components/schemas/Preferencias' } } }

