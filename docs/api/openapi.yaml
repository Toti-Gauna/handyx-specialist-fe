openapi: 3.1.0
info:
  title: api-especialista (Handyx)
  version: 0.8.0
  description: |
    BORRADOR del contrato de api-especialista (TECH-20). Fuente de los esquemas: src/contracts/dto.ts
    (contrato compartido v0.6.0, dueño handyx-client-be). Nada implementado todavía: lo construye
    handyx-specialist-be en la fase 4. Sesión por cookie HttpOnly; CSRF en X-CSRF-Token para mutaciones;
    Idempotency-Key (UUIDv4) donde se indica. Timestamps UTC; importes en centavos enteros.
servers:
  - url: https://api.handyc.com/especialista
    description: Producción prevista (PENDIENTE de recurso en Render)
  - url: http://localhost:4000
    description: Desarrollo local

security:
  - sesion: []

tags:
  - name: auth
  - name: perfil
  - name: disponibilidad
  - name: pedidos
  - name: propuestas
  - name: trabajos
  - name: mapa
  - name: mensajes
  - name: caja
  - name: soporte
  - name: fee
  - name: cuenta

paths:
  /v1/auth/registro:
    post:
      tags: [auth]
      security: []
      summary: Crear cuenta de especialista (respuesta neutra si ya existe)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password, terminos, privacidad]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 12, maxLength: 128 }
                terminos: { type: string, description: id de la versión aceptada }
                privacidad: { type: string, description: id de la versión del aviso aceptado }
      responses:
        '202': { description: Recibido (mismo resultado exista o no la cuenta) }
        '400': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /v1/auth/ingreso:
    post:
      tags: [auth]
      security: []
      summary: Iniciar sesión (emite cookie HttpOnly)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Sesión iniciada
          content: { application/json: { schema: { $ref: '#/components/schemas/Sesion' } } }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /v1/auth/sesion:
    get:
      tags: [auth]
      summary: Sesión actual y token CSRF (solo en memoria del cliente)
      responses:
        '200':
          description: Con sesión
          content: { application/json: { schema: { $ref: '#/components/schemas/Sesion' } } }
        '401': { $ref: '#/components/responses/Error' }
  /v1/auth/salida:
    post:
      tags: [auth]
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      responses:
        '204': { description: Sesión revocada }

  # ── 0.3.0 · Cuenta (lote 4.2): código por email, Google o Apple y recuperación con enlace ──────
  /v1/auth/verificacion:
    get:
      tags: [auth]
      summary: Estado del código de 6 dígitos enviado al email (el código nunca viaja al cliente)
      responses:
        '200':
          description: Código vigente
          content: { application/json: { schema: { $ref: '#/components/schemas/VerificacionEmail' } } }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    post:
      tags: [auth]
      summary: Verificar el email con el código (5 intentos; vence a los 10 minutos)
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [codigo]
              properties:
                codigo: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200':
          description: Email verificado
          content: { application/json: { schema: { $ref: '#/components/schemas/Sesion' } } }
        '400': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /v1/auth/verificacion/reenvio:
    post:
      tags: [auth]
      summary: Mandar otro código (solo después de reenviarDesde)
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      responses:
        '200':
          description: Código nuevo enviado
          content: { application/json: { schema: { $ref: '#/components/schemas/VerificacionEmail' } } }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /v1/auth/proveedor:
    post:
      tags: [auth]
      security: []
      summary: Entrar con Google o Apple (el servidor valida firma, audiencia, emisor, vencimiento y nonce del id_token)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [proveedor, idToken, nonce]
              properties:
                proveedor: { type: string, enum: [google, apple] }
                idToken: { type: string, minLength: 20 }
                nonce: { type: string, minLength: 16 }
      responses:
        '200':
          description: Sesión iniciada; cuentaNueva indica que falta aceptar términos y privacidad
          content: { application/json: { schema: { $ref: '#/components/schemas/ResultadoProveedor' } } }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /v1/auth/aceptaciones:
    post:
      tags: [auth]
      summary: Aceptar términos y privacidad (cuentas nuevas de Google o Apple)
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [terminos, privacidad]
              properties:
                terminos: { type: string, description: id de la versión aceptada }
                privacidad: { type: string, description: id de la versión del aviso aceptado }
      responses:
        '204': { description: Aceptaciones registradas }
        '400': { $ref: '#/components/responses/Error' }
  /v1/auth/recuperacion/estado:
    post:
      tags: [auth]
      security: []
      summary: Estado del enlace de recuperación (token en el cuerpo, nunca en la ruta; uno desconocido se informa vencido)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: { type: string, minLength: 16 }
      responses:
        '200':
          description: Estado del enlace
          content: { application/json: { schema: { $ref: '#/components/schemas/EstadoToken' } } }
        '429': { $ref: '#/components/responses/Error' }
  /v1/auth/recuperacion/nueva:
    post:
      tags: [auth]
      security: []
      summary: Elegir la contraseña nueva con el enlace (un solo uso; cierra todas las sesiones)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, password]
              properties:
                token: { type: string, minLength: 16 }
                password: { type: string, minLength: 12, maxLength: 128 }
      responses:
        '204': { description: Contraseña cambiada }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /v1/especialista/perfil:
    get:
      tags: [perfil]
      responses:
        '200':
          description: Perfil propio con estados de revisión (nunca el contenido de los documentos)
          content: { application/json: { schema: { $ref: '#/components/schemas/PerfilEspecialista' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /v1/especialista/documentos/{tipo}:
    post:
      tags: [perfil]
      summary: Cargar un documento (queda `cargado`; solo Operations verifica)
      description: Antecedentes NO se aceptan como archivo; se verifican en persona.
      parameters:
        - { $ref: '#/components/parameters/Csrf' }
        - name: tipo
          in: path
          required: true
          schema: { type: string, enum: [dni, cuit_cuil, foto_cara, matricula] }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                archivo: { type: string, format: binary, description: 'image/jpeg|png|webp, tamaño máximo PENDIENTE. En el DNI, el frente' }
                dorso: { type: string, format: binary, description: 'Solo y obligatorio para el DNI (0.5.0): el dorso' }
                rubro: { type: string, description: solo para matrícula }
      responses:
        '201':
          description: Cargado
          content: { application/json: { schema: { $ref: '#/components/schemas/PerfilEspecialista' } } }
        '400': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
  /v1/especialista/antecedentes/turnos:
    get:
      tags: [perfil]
      summary: Turnos de la verificación presencial de antecedentes (0.5.0). El certificado se muestra en persona, nunca se sube
      responses:
        '200':
          description: Turnos futuros, libres u ocupados
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TurnoAntecedentes' } } } }
  /v1/especialista/antecedentes/turno:
    put:
      tags: [perfil]
      summary: Reservar o cambiar el turno (0.5.0). Libera el anterior y deja la verificación en cita_coordinada
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [turnoId], properties: { turnoId: { type: string, format: uuid } } }
      responses:
        '200':
          description: Perfil con la cita
          content: { application/json: { schema: { $ref: '#/components/schemas/PerfilEspecialista' } } }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/especialista/alta/envio:
    post:
      tags: [perfil]
      summary: Enviar el alta a revisión (borrador|requiere_correccion → enviada)
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      responses:
        '200':
          description: Enviada
          content: { application/json: { schema: { $ref: '#/components/schemas/PerfilEspecialista' } } }
        '409': { $ref: '#/components/responses/Error' }

  /v1/especialista/disponibilidad:
    get:
      tags: [disponibilidad]
      responses:
        '200':
          description: Disponibilidad declarada
          content: { application/json: { schema: { $ref: '#/components/schemas/Disponibilidad' } } }
    put:
      tags: [disponibilidad]
      summary: Cambiar disponibilidad (revocar urgentes corta la oferta al instante)
      description: >-
        Durante el alta (borrador, corrección, enviada o en revisión) solo se pueden declarar zonas y franjas: urgentesAhora
        y programados quedan en false hasta que el alta esté habilitada (403 sin_permiso). (0.5.0)
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CambioDisponibilidad' } } }
      responses:
        '200':
          description: Guardada
          content: { application/json: { schema: { $ref: '#/components/schemas/Disponibilidad' } } }
        '409': { $ref: '#/components/responses/Error' }

  /v1/especialista/pedidos:
    get:
      tags: [pedidos]
      summary: Pedidos elegibles, filtrados en servidor y por orden de llegada
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: tipo, in: query, schema: { type: string, enum: [urgente, programado, obra] } }
      responses:
        '200':
          description: Página
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, siguienteCursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/PedidoElegible' } }
                  siguienteCursor: { type: [string, 'null'] }
  /v1/especialista/pedidos/{id}:
    get:
      tags: [pedidos]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Detalle con datos mínimos (zona aproximada, sin dirección exacta)
          content: { application/json: { schema: { $ref: '#/components/schemas/PedidoElegible' } } }
        '404': { $ref: '#/components/responses/Error' }

  /v1/especialista/propuestas:
    post:
      tags: [propuestas]
      summary: Enviar propuesta o contrapropuesta (reemplazaA)
      parameters: [{ $ref: '#/components/parameters/Csrf' }, { $ref: '#/components/parameters/Idempotencia' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/NuevaPropuesta' } } }
      responses:
        '201':
          description: Creada (vencimiento calculado por el servidor)
          content: { application/json: { schema: { $ref: '#/components/schemas/Propuesta' } } }
        '200':
          description: Repetición con la misma Idempotency-Key (mismo resultado)
          content: { application/json: { schema: { $ref: '#/components/schemas/Propuesta' } } }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/especialista/propuestas/{id}/respuesta:
    post:
      tags: [propuestas]
      summary: Aceptar o rechazar una propuesta del usuario (solo contraparte, pendiente y vigente)
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/Csrf' }
        - { $ref: '#/components/parameters/Idempotencia' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RespuestaPropuesta' } } }
      responses:
        '200':
          description: Respondida; si aceptó, devuelve el trabajo creado en la misma transacción
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [propuesta, trabajo]
                properties:
                  propuesta: { $ref: '#/components/schemas/Propuesta' }
                  trabajo: { oneOf: [{ $ref: '#/components/schemas/Trabajo' }, { type: 'null' }] }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/especialista/propuestas/{id}/retiro:
    post:
      tags: [propuestas]
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/Csrf' }]
      responses:
        '200':
          description: Retirada
          content: { application/json: { schema: { $ref: '#/components/schemas/Propuesta' } } }
        '409': { $ref: '#/components/responses/Error' }

  /v1/especialista/trabajos:
    get:
      tags: [trabajos]
      parameters:
        - { name: estado, in: query, schema: { type: string, enum: [activos, historial] } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: Página de trabajos propios
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, siguienteCursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Trabajo' } }
                  siguienteCursor: { type: [string, 'null'] }
  /v1/especialista/trabajos/{id}/eventos:
    post:
      tags: [trabajos]
      summary: 'Salir, empezar o terminar (0.7.0: la llegada y la cancelación tienen su propio endpoint). Terminar retira los adicionales pendientes y crea el cobro por el total vigente'
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/Csrf' }
        - { $ref: '#/components/parameters/Idempotencia' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [hacia, version]
              properties:
                hacia: { type: string, enum: [en_camino, en_curso, finalizado] }
                version: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Trabajo actualizado
          content: { application/json: { schema: { $ref: '#/components/schemas/Trabajo' } } }
        '409': { $ref: '#/components/responses/Error' }
  /v1/especialista/trabajos/{id}/llegada:
    post:
      tags: [trabajos]
      summary: '"Ya llegué" (0.7.0): respaldo de la llegada automática, solo cuando la ubicación anda mal y con el motivo. La automática la marca el servidor al recibir una posición dentro del radio'
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/Csrf' }, { $ref: '#/components/parameters/Idempotencia' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [motivo, version]
              properties:
                motivo: { type: string, enum: [sin_permiso, imprecisa, sin_senal, sin_ubicacion] }
                version: { type: integer, minimum: 0 }
      responses:
        '200':
          description: En el lugar; el usuario recibe el aviso
          content: { application/json: { schema: { $ref: '#/components/schemas/Trabajo' } } }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/especialista/trabajos/{id}/cancelacion:
    post:
      tags: [trabajos]
      summary: Cancelar con motivo (0.7.0). Sin penalización automática; en curso solo cancela Operations
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/Csrf' }, { $ref: '#/components/parameters/Idempotencia' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [motivo, version]
              properties:
                motivo: { type: string, enum: [no_puedo_ir, problema_personal, cliente_no_responde, trabajo_distinto, riesgo_en_el_lugar, otro] }
                version: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Cancelado
          content: { application/json: { schema: { $ref: '#/components/schemas/Trabajo' } } }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/especialista/trabajos/{id}/adicionales:
    post:
      tags: [trabajos]
      summary: Agregar repuestos o mano de obra con el trabajo en curso (0.7.0). Lo acepta o rechaza el usuario; mientras tanto rige el precio vigente
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/Csrf' }, { $ref: '#/components/parameters/Idempotencia' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/NuevoAdicional' } } }
      responses:
        '201':
          description: Adicional pendiente
          content: { application/json: { schema: { $ref: '#/components/schemas/Adicional' } } }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/especialista/trabajos/{id}/adicionales/{adicionalId}/retiro:
    post:
      tags: [trabajos]
      summary: Retirar un adicional que el usuario todavía no respondió (0.7.0)
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: adicionalId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/Csrf' }
      responses:
        '200':
          description: Retirado
          content: { application/json: { schema: { $ref: '#/components/schemas/Adicional' } } }
        '409': { $ref: '#/components/responses/Error' }
  /v1/especialista/trabajos/{id}/etapas/{etapaId}/fin:
    post:
      tags: [obras]
      summary: Terminar la etapa en curso de una obra (0.8.0). Crea su cobro (directo del cliente), retira sus adicionales sin respuesta y arranca la siguiente
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: etapaId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/Csrf' }
        - { $ref: '#/components/parameters/Idempotencia' }
      responses:
        '200':
          description: El cobro de la etapa (pendiente)
          content: { application/json: { schema: { $ref: '#/components/schemas/Pago' } } }
        '409': { $ref: '#/components/responses/Error' }
  /v1/especialista/trabajos/{id}/jornadas/{jornadaId}/cambio:
    post:
      tags: [obras]
      summary: Pedir otro día para una jornada (0.8.0). Queda pendiente hasta que el cliente acepta y no mueve las demás
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: jornadaId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/Csrf' }
        - { $ref: '#/components/parameters/Idempotencia' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [horario, motivo]
              properties:
                horario: { $ref: '#/components/schemas/Horario' }
                motivo: { type: string, enum: [otro_trabajo, imprevisto, falta_repuesto, pedido_del_cliente, clima, otro] }
      responses:
        '200':
          description: Jornada con el cambio pendiente
          content: { application/json: { schema: { $ref: '#/components/schemas/Jornada' } } }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/especialista/trabajos/{id}/diario:
    post:
      tags: [obras]
      summary: Cargar el avance del día en el diario de obra (0.8.0). Lo ve el cliente; con una jornada, la marca hecha
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/Csrf' }, { $ref: '#/components/parameters/Idempotencia' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [etapaId, nota]
              properties:
                etapaId: { type: string, format: uuid }
                jornadaId: { type: string, format: uuid }
                nota: { type: string, minLength: 1, maxLength: 280 }
                fotos: { type: array, maxItems: 4, items: { type: string, format: binary }, description: 'image/jpeg|png|webp; se guardan privadas' }
      responses:
        '201':
          description: Entrada del diario
          content: { application/json: { schema: { $ref: '#/components/schemas/EntradaDiario' } } }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/especialista/trabajos/{id}/llamada:
    post:
      tags: [trabajos]
      summary: Número puente de Handyx para llamar a la otra parte sin ver su teléfono (0.7.0). Solo con el trabajo activo; dura unos minutos
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/Csrf' }]
      responses:
        '200':
          description: Número puente
          content: { application/json: { schema: { $ref: '#/components/schemas/LlamadaPuente' } } }
        '409': { $ref: '#/components/responses/Error' }

  /v1/conversaciones/{id}/mensajes:
    get:
      tags: [mensajes]
      parameters: [{ $ref: '#/components/parameters/Id' }, { name: cursor, in: query, schema: { type: string } }]
      responses:
        '200':
          description: Mensajes (solo participantes)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, siguienteCursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Mensaje' } }
                  siguienteCursor: { type: [string, 'null'] }
        '404': { $ref: '#/components/responses/Error' }
    post:
      tags: [mensajes]
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/Csrf' }
        - { $ref: '#/components/parameters/Idempotencia' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [texto]
              properties:
                texto: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '201':
          description: Enviado
          content: { application/json: { schema: { $ref: '#/components/schemas/Mensaje' } } }

  /v1/especialista/caja:
    get:
      tags: [caja]
      summary: Pagos directos recibidos por el especialista (Handy no es receptor)
      responses:
        '200':
          description: Página de pagos
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, siguienteCursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Pago' } }
                  siguienteCursor: { type: [string, 'null'] }
  /v1/especialista/pagos/{id}/reporte:
    post:
      tags: [caja]
      summary: Reportar cobro en efectivo o MP directo (queda `reportado`, no verificado)
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/Csrf' }
        - { $ref: '#/components/parameters/Idempotencia' }
      responses:
        '200':
          description: Reportado
          content: { application/json: { schema: { $ref: '#/components/schemas/Pago' } } }
        '409': { $ref: '#/components/responses/Error' }

  /v1/soporte/casos:
    get:
      tags: [soporte]
      responses:
        '200':
          description: Casos propios
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, siguienteCursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/CasoSoporte' } }
                  siguienteCursor: { type: [string, 'null'] }
    post:
      tags: [soporte]
      parameters: [{ $ref: '#/components/parameters/Csrf' }, { $ref: '#/components/parameters/Idempotencia' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [categoria, detalle]
              properties:
                categoria: { type: string, enum: [asistencia, reclamo, pago, cuenta] }
                trabajoId: { type: [string, 'null'], format: uuid }
                pedidoId: { type: [string, 'null'], format: uuid }
                detalle: { type: string, minLength: 1, maxLength: 4000 }
      responses:
        '201':
          description: Abierto
          content: { application/json: { schema: { $ref: '#/components/schemas/CasoSoporte' } } }

  /v1/fee/vigente:
    get:
      tags: [fee]
      summary: Política de fee vigente (null = ninguna; no se infiere tarifa)
      responses:
        '200':
          description: Fee vigente
          content: { application/json: { schema: { $ref: '#/components/schemas/FeeVigente' } } }
  /v1/fee/aviso:
    post:
      tags: [fee]
      summary: Registrar que el especialista vio y aceptó el aviso de esta versión (fee_acceptances)
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [politicaId, version]
              properties:
                politicaId: { type: string }
                version: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Registrado
          content: { application/json: { schema: { $ref: '#/components/schemas/FeeVigente' } } }

  /v1/cuenta/baja:
    get:
      tags: [cuenta]
      summary: Estado real de la baja (null si no hay)
      responses:
        '200':
          description: Baja o null
          content: { application/json: { schema: { oneOf: [{ $ref: '#/components/schemas/Baja' }, { type: 'null' }] } } }
    delete:
      tags: [cuenta]
      summary: Cancelar la baja (solo mientras está `solicitada`)
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      responses:
        '204': { description: Cancelada }
        '409': { $ref: '#/components/responses/Error' }
    post:
      tags: [cuenta]
      summary: Solicitar eliminación real de la cuenta (revoca sesiones; estado honesto)
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      responses:
        '202':
          description: Solicitada
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [estado]
                properties:
                  estado: { type: string, enum: [solicitada, en_proceso, completada, completada_con_retencion, cancelada] }

  /v1/auth/recuperar:
    post:
      tags: [auth]
      security: []
      summary: Pedir instrucciones para elegir una contraseña nueva (respuesta neutra)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202': { description: Recibido (igual exista o no la cuenta) }
        '429': { $ref: '#/components/responses/Error' }

  /v1/especialista/perfil/publico:
    get:
      tags: [perfil]
      summary: Cómo te ve el usuario del hogar (el sello verificado solo lo pone el backend)
      responses:
        '200':
          description: Vista pública
          content: { application/json: { schema: { $ref: '#/components/schemas/PerfilPublico' } } }
  /v1/especialista/alta/datos:
    get:
      tags: [perfil]
      summary: Datos del alta (DNI y CUIT/CUIL solo con los últimos dígitos)
      responses:
        '200':
          description: Datos guardados
          content: { application/json: { schema: { $ref: '#/components/schemas/DatosAlta' } } }
    put:
      tags: [perfil]
      summary: 'Guardar datos del alta (parcial: se puede retomar). Solo con el alta en borrador o con corrección pedida'
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/GuardarDatosAlta' } } }
      responses:
        '200':
          description: Guardado
          content: { application/json: { schema: { $ref: '#/components/schemas/DatosAlta' } } }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/especialista/rubros:
    put:
      tags: [perfil]
      summary: 'Elegir rubros. Gas y aire acondicionado quedan "requiere_matricula" hasta que Operations verifique'
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [rubros]
              properties:
                rubros: { type: array, items: { $ref: '#/components/schemas/Rubro' } }
      responses:
        '200':
          description: Perfil actualizado
          content: { application/json: { schema: { $ref: '#/components/schemas/PerfilEspecialista' } } }
        '409': { $ref: '#/components/responses/Error' }

  /v1/especialista/inicio:
    get:
      tags: [pedidos]
      summary: Resumen del Inicio (nunca tasa de aceptación, tiempos de respuesta ni puntualidad)
      responses:
        '200':
          description: Resumen
          content: { application/json: { schema: { $ref: '#/components/schemas/Inicio' } } }
  /v1/especialista/avisos:
    get:
      tags: [pedidos]
      summary: Avisos dentro de la app, más nuevos primero (sin datos personales)
      responses:
        '200':
          description: Avisos
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Aviso' } } } }
    delete:
      tags: [pedidos]
      summary: Borrar todos los avisos (0.6.0). Lo importante sigue en su pantalla (pedido, trabajo, caja)
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      responses:
        '204': { description: Borrados }
  /v1/especialista/avisos/{id}:
    delete:
      tags: [pedidos]
      summary: Borrar un aviso (0.6.0). Uno ajeno o inexistente responde igual
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/Csrf' }]
      responses:
        '204': { description: Borrado }
  /v1/especialista/avisos/{id}/leido:
    post:
      tags: [pedidos]
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/Csrf' }]
      responses:
        '204': { description: Marcado como leído (abrir un aviso nunca acepta nada) }
  /v1/especialista/pedidos/{id}/conversacion:
    post:
      tags: [mensajes]
      summary: Abrir (o devolver) el chat de un pedido antes de contratar. No compromete nada
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/Csrf' }]
      responses:
        '200':
          description: Conversación
          content: { application/json: { schema: { $ref: '#/components/schemas/Conversacion' } } }
        '404': { $ref: '#/components/responses/Error' }

  /v1/especialista/trabajos/{id}:
    get:
      tags: [trabajos]
      summary: Detalle con acuerdo vigente, historial, etapas y cambio pendiente
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Detalle
          content: { application/json: { schema: { $ref: '#/components/schemas/TrabajoDetalle' } } }
        '404': { $ref: '#/components/responses/Error' }
  /v1/especialista/trabajos/{id}/cambio:
    post:
      tags: [trabajos]
      summary: Proponer otra fecha, importe o alcance. El acuerdo vigente no cambia hasta que la otra parte acepte
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/Csrf' }, { $ref: '#/components/parameters/Idempotencia' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/NuevoCambio' } } }
      responses:
        '201':
          description: Propuesta de cambio pendiente
          content: { application/json: { schema: { $ref: '#/components/schemas/Propuesta' } } }
        '409': { $ref: '#/components/responses/Error' }
  /v1/especialista/mapa/barrios:
    get:
      tags: [mapa]
      summary: Barrios de cobertura con un punto para la etiqueta del mapa (0.4.0)
      responses:
        '200':
          description: Barrios
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Barrio' } } } }
  /v1/especialista/trabajos/{id}/viaje:
    get:
      tags: [mapa]
      summary: Destino, trayecto y última posición del viaje (0.4.0). Solo para las partes de un trabajo con dirección
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Viaje
          content: { application/json: { schema: { $ref: '#/components/schemas/Viaje' } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/especialista/trabajos/{id}/viaje/posiciones:
    post:
      tags: [mapa]
      summary: >-
        Posición actual mientras el trabajo está en camino (0.4.0). El cliente de ese trabajo la ve en vivo (SSE de su lado).
        La primera calcula el trayecto; con dos posiciones seguidas fuera del trayecto se recalcula y sube su versión.
        La posición va en el cuerpo, nunca en la URL. Como mucho una cada 5 s. Retención: 30 días.
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/Posicion' } } }
      responses:
        '200':
          description: Viaje actualizado
          content: { application/json: { schema: { $ref: '#/components/schemas/Viaje' } } }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
    delete:
      tags: [mapa]
      summary: Dejar de compartir la ubicación (0.4.0). El servidor también deja de compartir al llegar, empezar, terminar o cancelar
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/Csrf' }]
      responses:
        '200':
          description: Viaje sin compartir
          content: { application/json: { schema: { $ref: '#/components/schemas/Viaje' } } }
  /v1/especialista/agenda:
    get:
      tags: [trabajos]
      summary: Trabajos y ofertas pendientes del rango (una oferta no es un turno)
      parameters:
        - { name: desde, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: hasta, in: query, required: true, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Items de agenda
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AgendaItem' } } } }

  /v1/conversaciones:
    get:
      tags: [mensajes]
      responses:
        '200':
          description: Conversaciones propias, la más reciente primero
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Conversacion' } } } }
  /v1/conversaciones/{id}:
    get:
      tags: [mensajes]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Conversación
          content: { application/json: { schema: { $ref: '#/components/schemas/Conversacion' } } }
        '404': { $ref: '#/components/responses/Error' }
  /v1/conversaciones/{id}/propuestas:
    get:
      tags: [mensajes]
      summary: Presupuestos estructurados del hilo
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Propuestas
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Propuesta' } } } }

  /v1/especialista/caja/resumen:
    get:
      tags: [caja]
      responses:
        '200':
          description: Totales por estado y tarifa de Handy del período (0 en la demo). No hay saldo de Handy
          content: { application/json: { schema: { $ref: '#/components/schemas/CajaResumen' } } }
  /v1/especialista/pagos/{id}/discrepancia:
    post:
      tags: [caja]
      summary: Marcar que el cobro o el importe no coinciden (solo desde `reportado`)
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/Csrf' }, { $ref: '#/components/parameters/Idempotencia' }]
      responses:
        '200':
          description: En discrepancia
          content: { application/json: { schema: { $ref: '#/components/schemas/Pago' } } }
        '409': { $ref: '#/components/responses/Error' }

  /v1/soporte/casos/{id}:
    get:
      tags: [soporte]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Caso con su historial
          content: { application/json: { schema: { $ref: '#/components/schemas/CasoSoporteDetalle' } } }
        '404': { $ref: '#/components/responses/Error' }
  /v1/soporte/casos/{id}/mensajes:
    post:
      tags: [soporte]
      summary: Responder un caso (reabre uno resuelto)
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/Csrf' }, { $ref: '#/components/parameters/Idempotencia' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [texto]
              properties:
                texto: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '200':
          description: Caso actualizado
          content: { application/json: { schema: { $ref: '#/components/schemas/CasoSoporteDetalle' } } }

  /v1/cuenta/preferencias:
    get:
      tags: [cuenta]
      responses:
        '200':
          description: Preferencias de avisos
          content: { application/json: { schema: { $ref: '#/components/schemas/Preferencias' } } }
    put:
      tags: [cuenta]
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [avisosUrgentes, avisosProgramados, avisosMensajes, avisosPagos]
              properties:
                avisosUrgentes: { type: boolean }
                avisosProgramados: { type: boolean }
                avisosMensajes: { type: boolean }
                avisosPagos: { type: boolean }
      responses:
        '200':
          description: Guardadas
          content: { application/json: { schema: { $ref: '#/components/schemas/Preferencias' } } }
  /v1/cuenta/push:
    post:
      tags: [cuenta]
      summary: Registrar el opt-in a avisos del dispositivo (la entrega no está garantizada)
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      responses:
        '200':
          description: Estado del permiso
          content: { application/json: { schema: { $ref: '#/components/schemas/Preferencias' } } }

components:
  securitySchemes:
    sesion:
      type: apiKey
      in: cookie
      name: __Host-handyx_esp
      description: Cookie HttpOnly/Secure/SameSite=Lax emitida por la API

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Csrf:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string }
    Idempotencia:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }

  responses:
    Error:
      description: Error con código estable, mensaje seguro y requestId
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorApi' } } }

  schemas:
    Instante: { type: string, format: date-time, description: UTC con Z }
    Monto:
      type: object
      additionalProperties: false
      required: [centavos, moneda]
      properties:
        centavos: { type: integer, minimum: 0 }
        moneda: { type: string, enum: [ARS] }
    Rubro: { type: string, enum: [electricidad, plomeria, gas, cerrajeria, albanileria, aire_acondicionado] }
    EstadoDocumento: { type: string, enum: [faltante, cargado, en_revision, verificado, rechazado, vencido] }
    ErrorApi:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [codigo, mensaje, requestId]
          properties:
            codigo:
              type: string
              enum:
                [validacion, no_autenticado, sin_permiso, no_encontrado, conflicto_version, propuesta_no_disponible,
                 transicion_invalida, pedido_no_elegible, tipo_archivo_prohibido, limite, servicio_no_disponible, interno]
            mensaje: { type: string }
            requestId: { type: string }
            campos:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [campo, codigo]
                properties:
                  campo: { type: string }
                  codigo: { type: string }
    Sesion:
      type: object
      additionalProperties: false
      required: [cuenta, csrfToken, expiraEn]
      properties:
        cuenta:
          type: object
          additionalProperties: false
          required: [id, roles, emailVerificado, terminosAceptados]
          properties:
            id: { type: string, format: uuid }
            roles: { type: array, items: { type: string, enum: [usuario, especialista] } }
            emailVerificado: { type: boolean, description: '0.3.0 · hasta verificar el código solo se puede verificar, reenviar o salir' }
            terminosAceptados: { type: boolean, description: '0.3.0 · las cuentas nuevas de Google o Apple aceptan después de entrar' }
        csrfToken: { type: string, minLength: 16 }
        expiraEn: { $ref: '#/components/schemas/Instante' }
    Punto:
      type: object
      additionalProperties: false
      required: [lat, lng]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
    ZonaMapa:
      type: object
      additionalProperties: false
      required: [centro, radioM]
      properties:
        centro: { $ref: '#/components/schemas/Punto' }
        radioM: { type: integer, minimum: 200, maximum: 5000 }
    Barrio:
      type: object
      additionalProperties: false
      required: [id, nombre, centro]
      properties:
        id: { type: string, minLength: 1 }
        nombre: { type: string, minLength: 1 }
        centro: { $ref: '#/components/schemas/Punto' }
    Posicion:
      type: object
      additionalProperties: false
      required: [punto, precisionM, en]
      properties:
        punto: { $ref: '#/components/schemas/Punto' }
        precisionM: { type: number, minimum: 0, maximum: 10000 }
        en: { $ref: '#/components/schemas/Instante' }
    Trayecto:
      type: object
      additionalProperties: false
      required: [linea, distanciaM, duracionS, version]
      properties:
        linea: { type: array, minItems: 2, maxItems: 5000, items: { $ref: '#/components/schemas/Punto' } }
        distanciaM: { type: integer, minimum: 0 }
        duracionS: { type: integer, minimum: 0 }
        version: { type: integer, minimum: 0 }
    Viaje:
      type: object
      additionalProperties: false
      required: [trabajoId, destino, estado, trayecto, ultimaPosicion, distanciaRestanteM, llegadaEstimada]
      properties:
        trabajoId: { type: string, format: uuid }
        destino: { $ref: '#/components/schemas/Punto' }
        estado: { type: string, enum: [sin_compartir, compartiendo, terminado] }
        trayecto:
          description: Null sin posición o si el motor de trayectos no pudo calcularlo
          oneOf: [{ $ref: '#/components/schemas/Trayecto' }, { type: 'null' }]
        ultimaPosicion: { oneOf: [{ $ref: '#/components/schemas/Posicion' }, { type: 'null' }] }
        distanciaRestanteM: { type: [integer, 'null'], minimum: 0 }
        llegadaEstimada: { oneOf: [{ $ref: '#/components/schemas/Instante' }, { type: 'null' }] }
    VerificacionEmail:
      type: object
      additionalProperties: false
      required: [emailEnmascarado, venceEn, reenviarDesde, intentosRestantes]
      properties:
        emailEnmascarado: { type: string, description: 'ma•••@dominio' }
        venceEn: { $ref: '#/components/schemas/Instante' }
        reenviarDesde: { $ref: '#/components/schemas/Instante' }
        intentosRestantes: { type: integer, minimum: 0 }
    ResultadoProveedor:
      type: object
      additionalProperties: false
      required: [sesion, cuentaNueva]
      properties:
        sesion: { $ref: '#/components/schemas/Sesion' }
        cuentaNueva: { type: boolean }
    EstadoToken:
