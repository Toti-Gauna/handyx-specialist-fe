        totalVigente: { $ref: '#/components/schemas/Monto', description: lo acordado más los adicionales aceptados }
        jornadas: { type: array, items: { $ref: '#/components/schemas/Jornada' }, description: obra (0.8.0), en orden; vacío en un trabajo de un día }
        diario: { type: array, items: { $ref: '#/components/schemas/EntradaDiario' }, description: obra (0.8.0), del más nuevo al más viejo }
    EtapaObra:
